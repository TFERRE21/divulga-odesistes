name: Publicar Pins aprovados
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
permissions:
  contents: write
concurrency:
  group: pinterest-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publicar apenas itens aprovados e registrar resultado
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: node scripts/publish-pinterest.js
      - name: Salvar fila e histórico de divulgação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pinterest-queue.json data/publication-log.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update publication queue and history"
            git push
          fi
